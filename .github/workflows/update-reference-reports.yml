name: Update Reference Reports

on:
  workflow_dispatch:
    inputs:
      report:
        description: 'Report to update'
        required: true
        type: choice
        # UC Use Case reports based on ReportingFramework
        options:
        - UC-01-Project-Initialization
        - UC-02-Scenario-Creation
        - UC-03-Scenario-Results-RoundTrip
        - UC-04-PK-Parameter-Loading
        - UC-05-Population-Export
        - UC-06-Utilities-Data-Integration
        - UC-07A-Plot-TimeProfiles
        - UC-07B-Plot-PKBoxwhisker
        - UC-07C-Plot-PKForest
        - UC-07D-Plot-Demographics
        - UC-08-Report-Generation
        - UC-09-EPackage-Export
        - UC-10-Sensitivity-Analysis
        - UC-11-Snapshot-Version-Control

permissions: write-all

jobs:
  update-reference-reports:
    runs-on: ubuntu-latest
    # Allow only authorized collaborators to trigger GA:
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
# All steps in workflow:
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update reference report with test report
        run: |
          rm -r Reports/${{ inputs.report }}
          cp -R tests/Reports/${{ inputs.report }} Reports/${{ inputs.report }}
      - name: Commit updates
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add ./Reports/${{ inputs.report }} || echo "No changes in Reference Report ${{ inputs.report }}"
          git commit -m "Update ${{ inputs.report }}" || echo "No changes to commit"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: 30_update_${{ inputs.report }}
          title: 'Update ${{ inputs.report }}'
          body: |
            Update Reference Report ${{ inputs.report }} #30
          labels: |
            update

