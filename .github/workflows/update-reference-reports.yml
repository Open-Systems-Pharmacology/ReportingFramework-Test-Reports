name: Update Reference Reports

on:
  workflow_dispatch:
    inputs:
      report:
        description: 'Report to update (must match Report in tests/testthat/report-mapping.json)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-reference-reports:
    runs-on: ubuntu-latest
    # Allow only authorized collaborators to trigger GA:
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
# All steps in workflow:
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate selected report against mapping
        shell: python
        run: |
          import subprocess
          import sys

          cmd = [
              sys.executable,
              ".github/workflows/validate-report-mapping.py",
              "--report",
              "${{ inputs.report }}",
          ]
          result = subprocess.run(cmd, check=False)
          if result.returncode != 0:
              raise SystemExit(result.returncode)
      - name: Ensure selected report is reference-enabled
        shell: python
        run: |
          import json
          from pathlib import Path

          report = "${{ inputs.report }}"
          mapping = json.loads(
              Path("tests/testthat/report-mapping.json").read_text(encoding="utf-8")
          )
          selected = [item for item in mapping if item.get("Report") == report]

          if not selected:
              raise SystemExit(f"Report not found in mapping: {report}")
          if not selected[0].get("Reference", False):
              raise SystemExit(
                  f"Report '{report}' has Reference=false and cannot be updated via this workflow."
              )
      - name: Update reference report with test report
        run: |
          mkdir -p Reports/${{ inputs.report }}
          rsync -a --delete --exclude "Report.md" tests/Reports/${{ inputs.report }}/ Reports/${{ inputs.report }}/
      - name: Commit updates
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add ./Reports/${{ inputs.report }} || echo "No changes in Reference Report ${{ inputs.report }}"
          git commit -m "Update ${{ inputs.report }}" || echo "No changes to commit"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update-reference-${{ inputs.report }}
          title: 'Update ${{ inputs.report }}'
          body: |
            Update reference report assets for ${{ inputs.report }} (excluding Report.md).
          labels: |
            update

