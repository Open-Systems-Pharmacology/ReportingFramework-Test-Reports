name: Run RE Report Tests

on: 
  workflow_dispatch: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write
  issues: write
  
jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.report-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build report matrix
        id: report-matrix
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          report_mappings = json.loads(Path("tests/testthat/report-mapping.json").read_text(encoding="utf-8"))
          matrix = {
              "include": [
                  {"report": mapping["Report"], "script": mapping["Script"]}
                  for mapping in report_mappings
              ]
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
              github_output.write(f"matrix={json.dumps(matrix)}\n")

  test-reports:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    runs-on: windows-latest
    # Allow only authorized collaborators to trigger GA:
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      REPORT_NAME: ${{ matrix.report }}
      REPORT_SCRIPT: ${{ matrix.script }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup Qualification Environment
        uses: Open-Systems-Pharmacology/Workflows/.github/actions/setup-qualification-environment@main
        with:
          tools-path: tools.csv
      
      - name: Run report and validations
        run: |
          install.packages(c('testthat','jsonlite'))
          source(".github/workflows/run-report-tests.R")
        shell: Rscript {0}
      
      - name: Save report artifacts
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: report-${{ matrix.report }}
          path: |
            tests/Reports/${{ matrix.report }}
            test-results/${{ matrix.report }}.json
            test-results/${{ matrix.report }}.rds
  
  aggregate-results:
    runs-on: windows-latest
    needs:
      - prepare-matrix
      - test-reports
    if: ${{ always() }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TEST_RESULTS_RDS: test-results.rds
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download report artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: report-*
          path: artifact-data
          merge-multiple: true

      - name: Aggregate test results
        run: |
          install.packages(c('jsonlite'))
          source(".github/workflows/merge-test-results.R")
        shell: Rscript {0}

      - name: Render README from aggregated results
        run: |
          install.packages(c('testthat','covr','rmarkdown','pkgdown'))
          rmarkdown::render("README.Rmd", encoding = "UTF-8")
        shell: Rscript {0}

      - name: Save test results as zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: log.json

      - name: Commit and push test files
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add README.md || echo "No changes in README"
          git add ./tests/Reports || echo "No changes in Test Reports"
          git add log.json || echo "No changes in log"
          git commit -m "Added/modified test reports and updated README" || echo "No changes to commit"
          git push origin
  
  notify-on-failure:
    runs-on: ubuntu-latest
    needs:
      - prepare-matrix
      - test-reports
      - aggregate-results
    if: ${{ always() && failure() && github.event_name == 'schedule' }}
    permissions:
      issues: write
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v9
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Test Reports Workflow Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `## Workflow Failure Report
            
            The test-reports workflow has failed.
            
            **Workflow Run:** [${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            
            **Branch:** ${context.ref}
            **Commit:** ${context.sha.substring(0, 7)}
            **Triggered by:** ${context.eventName}
            **Actor:** ${context.actor}
            
            Please investigate the failure and take appropriate action.
            
            ---
            *This issue was automatically created by the test-reports.yml workflow.*`,
              assignees: ['KatrinCoboeken', 'Yuri05'],
              labels: ['bug', 'automated']
            });
            console.log(`Created issue #${issue.data.number}`)
